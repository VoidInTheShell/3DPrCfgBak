[include fluidd.cfg]

[include   ebb36can.cfg]
[include   macro.cfg   ]
###canbus_uuid: d0994964f6c4   ebbcan36
###canbus_uuid: 9bfa466a9e40   rp2040

[mcu]
serial: /dev/ttyAMA0
restart_method:command

[printer]
kinematics: corexy
max_velocity: 1000
max_accel: 30000
max_z_velocity: 20
max_z_accel: 100


[stepper_x]
step_pin:PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 32
rotation_distance: 40
#endstop_pin: tmc2209_stepper_x:virtual_endstop
endstop_pin: EBBCan:PB6
position_endstop: 155
position_max: 160
homing_speed: 120
#step_pulse_duration:0.000004 

[tmc2209 stepper_x]
uart_pin: PC11
uart_address: 0
run_current: 1.6
stealthchop_threshold:0   #小于该速度静音

#diag_pin: ^PC1
#driver_SGTHRS: 200

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 32
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 155
position_max: 160
homing_speed: 120
#step_pulse_duration:0.000004 


[tmc2209 stepper_y]
uart_pin: PC11
uart_address: 2
run_current: 1.6
stealthchop_threshold:0  #小于该速度静音

[stepper_z]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 32
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop 
#position_endstop: 0
position_max: 160
position_min: -5

[tmc2209 stepper_z]
uart_pin: PC11
uart_address: 1
run_current:0.6
stealthchop_threshold: 0


[heater_bed]
heater_pin: PC9
sensor_type: Generic 3950
sensor_pin: PC3
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp:130

